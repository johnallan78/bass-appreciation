<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>John's Bass Appreciation | Transcriptions</title>
    <meta
      name="description"
      content="A modern, responsive index of bass guitar and double bass transcription PDFs."
    />
    <link rel="stylesheet" href="./styles/main.css" />
    <script src="./scripts/app.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <div class="hero__overlay"></div>
      <div class="container hero__content">
        <p class="eyebrow">John's Bass Appreciation</p>
        <h1>Bass Guitar + Double Bass Transcriptions</h1>
        <p class="hero__lede">
          Browse, search, and open transcription PDFs from a curated catalog.
        </p>
        <a class="button" href="#catalog">Browse Transcriptions</a>
      </div>
    </header>

    <main class="container">
      <section id="catalog" class="panel">
        <div class="catalog__head">
          <h2>Transcription Index</h2>
          <p id="resultsSummary" class="results-summary"></p>
        </div>

        <form class="controls" onsubmit="return false;" aria-label="Catalog filters">
          <label class="control">
            <span>Search</span>
            <input
              id="searchInput"
              type="search"
              placeholder="Title, artist, tags..."
              autocomplete="off"
            />
          </label>

          <label class="control">
            <span>Instrument</span>
            <select id="instrumentFilter">
              <option value="all">All instruments</option>
              <option value="bass-guitar">Bass guitar</option>
              <option value="double-bass">Double bass</option>
            </select>
          </label>

          <label class="control">
            <span>Sort</span>
            <select id="sortBy">
              <option value="updated-desc">Recently updated</option>
              <option value="updated-asc">Oldest updated</option>
              <option value="title-asc">Title A-Z</option>
              <option value="title-desc">Title Z-A</option>
            </select>
          </label>
        </form>

        <div id="tagFilters" class="tags" aria-label="Tag filters"></div>

        <div id="statusMessage" class="status-message" role="status"></div>
        <ul id="transcriptionList" class="cards" aria-live="polite"></ul>
      </section>
    </main>

    <footer class="container footer">
      <p>
        Stock imagery sourced from
        <a
          href="https://unsplash.com/photos/0t5wMsv1Zco"
          target="_blank"
          rel="noreferrer noopener"
          >Unsplash</a
        >
        and
        <a
          href="https://www.pexels.com/photo/wooden-double-bass-beside-wall-164936/"
          target="_blank"
          rel="noreferrer noopener"
          >Pexels</a
        >.
      </p>
    </footer>
  </body>
</html>
